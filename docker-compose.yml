services:
  db:
    image: postgres:16-alpine
    container_name: analise_meteorologica_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analiseMeteorologica}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-analiseMeteorologica}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: analise_meteorologica_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-analiseMeteorologica}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "false"
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        flask --app app init-db &&
        flask --app app seed-demo &&
        python app.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:5000/health")
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
