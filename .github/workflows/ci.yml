name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/analiseMeteorologica

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: analiseMeteorologica
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d analiseMeteorologica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxe
        run: |
          python -m compileall -q Controller DTOs Entity Enum Exception Repository Routes Service app.py seed.py tests

      - name: Validar Docker Compose
        run: |
          docker compose config

      - name: Testes de inicialização e integração
        run: |
          python -m unittest discover -s tests -v
